document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"3058d5de-ac56-4313-b153-141312926b5a\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  body { margin:0; background:#F4F1EC; font-family: 'IBM Plex Sans',Helvetica,Arial,sans-serif; color:#16130F; -webkit-font-smoothing:antialiased; }\n  * { box-sizing:border-box; }\n  a { color:#C63C15; text-decoration:none; }\n  a:hover { color:#16130F; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"1ea558fc-bec3-4674-aaf8-9d0d44ec794d#\u002Fdeck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n  <section data-label=\"Title\" data-screen-label=\"01\" data-speaker-notes=\"Evaluation brief, not a sales pitch. One sentence: Crawdad measures the conceptual structure of text, and it does it in a way you can hand to a reviewer.\" style=\"color:#16130F;background:#FBFAF8;padding:110px 130px;display:flex;flex-direction:column;justify-content:space-between\">\n    <div style=\"display:flex;align-items:center;gap:20px\">\n      <img src=\"43d257ff-bdba-4034-8ca2-cdf502e6607c\" alt=\"\" style=\"width:56px;height:60px;object-fit:contain;display:block\">\n      <div style=\"font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#6E6862;font-weight:500;font-family:'IBM Plex Mono',ui-monospace,monospace\">Crawdad 2026 · Evaluation brief<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h1 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:132px;line-height:.98;letter-spacing:-.028em;margin:0 0 44px;font-weight:600;max-width:20em\">Measure what holds<br>a text <span style=\"color:#C63C15\">together<\u002Fspan>.<\u002Fh1>\n      <p style=\"font-size:40px;line-height:1.45;color:#3D3833;margin:0;max-width:30em;text-wrap:pretty\">Centering Resonance Analysis for research teams — a published method, a deterministic implementation, and nothing to install.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;flex-wrap:wrap\">\n      <div style=\"border:1px solid #E7E2DA;background:#fff;border-radius:14px;padding:20px 28px;font-size:28px;font-weight:600;color:#3D3833\">Runs offline in a browser<\u002Fdiv>\n      <div style=\"border:1px solid #E7E2DA;background:#fff;border-radius:14px;padding:20px 28px;font-size:28px;font-weight:600;color:#3D3833\">Byte-identical reruns<\u002Fdiv>\n      <div style=\"border:1px solid #E7E2DA;background:#fff;border-radius:14px;padding:20px 28px;font-size:28px;font-weight:600;color:#3D3833\">Method published 2002, cited in every output<\u002Fdiv>\n      <div style=\"border:1px solid #E7E2DA;background:#fff;border-radius:14px;padding:20px 28px;font-size:28px;font-weight:600;color:#3D3833\">Version 1.4.7 · 2026-08-09<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Why it is different\" data-screen-label=\"02\" data-speaker-notes=\"The core claim. Word counting tells you what a text mentions. CRA tells you which concepts hold its argument together. Point at government: it is the structural hub of Lincoln's July 1861 message, and the periphery shows the concrete subject matter those abstractions organise.\" style=\"color:#16130F;background:#fff;padding:88px 100px;display:grid;grid-template-columns:.82fr 1.28fr;gap:64px;align-items:center\">\n    <div>\n      <div style=\"font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#C63C15;font-weight:500;font-family:'IBM Plex Mono',ui-monospace,monospace;margin-bottom:20px\">01 · The method<\u002Fdiv>\n      <h2 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:70px;line-height:1.05;letter-spacing:-.024em;margin:0 0 28px;font-weight:600\">Influence is not frequency<\u002Fh2>\n      <p style=\"font-size:30px;line-height:1.45;color:#3D3833;margin:0 0 30px;text-wrap:pretty\">CRA takes the nouns and adjectives inside noun phrases, links the ones adjacent in discourse, and scores each word by how often it lies on the shortest path between other words. The result is the vocabulary doing the organising work — not the loudest vocabulary.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;gap:18px;align-items:baseline\"><span style=\"color:#C63C15;font-size:26px;font-weight:700;font-family:'IBM Plex Mono',ui-monospace,monospace\">01<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#3D3833\">Answers questions counting cannot: what organises this text, how close are two texts, how does a corpus group.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:baseline\"><span style=\"color:#C63C15;font-size:28px;font-weight:700;font-family:'IBM Plex Mono',ui-monospace,monospace\">02<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#3D3833\">No model, no training data, no prompt — a defined calculation you can explain to a reviewer.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:baseline\"><span style=\"color:#C63C15;font-size:28px;font-weight:700;font-family:'IBM Plex Mono',ui-monospace,monospace\">03<\u002Fspan><span style=\"font-size:26px;line-height:1.4;color:#3D3833\">Fourteen text-level metrics come along for free: sentiment, readability, formality, diversity, cohesion.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E7E2DA;border-radius:22px;background:#FBFAF8;padding:26px 26px 20px\">\n      <svg sc-camel-view-box=\"22.3 30.6 853.4 497.8\" style=\"width:100%;height:auto;display:block\">\n        <path d=\"M241.7 373.1 Q340.8 331.1 410.1 248.7\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"5.20\" stroke-opacity=\"0.78\"><\u002Fpath>\n        <path d=\"M241.7 373.1 Q437.4 344.1 611.7 250.6\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"5.20\" stroke-opacity=\"0.78\"><\u002Fpath>\n        <path d=\"M241.7 373.1 Q400.4 439.1 572.4 438.4\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"4.40\" stroke-opacity=\"0.66\"><\u002Fpath>\n        <path d=\"M241.7 373.1 Q242.2 305.3 212.0 244.7\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"4.40\" stroke-opacity=\"0.66\"><\u002Fpath>\n        <path d=\"M241.7 373.1 Q442.7 392.9 638.8 344.9\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"3.60\" stroke-opacity=\"0.54\"><\u002Fpath>\n        <path d=\"M241.7 373.1 Q199.1 422.0 183.5 484.8\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"3.60\" stroke-opacity=\"0.54\"><\u002Fpath>\n        <path d=\"M241.7 373.1 Q171.2 289.4 70.5 246.8\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"3.60\" stroke-opacity=\"0.54\"><\u002Fpath>\n        <path d=\"M241.7 373.1 Q326.5 277.0 358.5 153.0\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"3.60\" stroke-opacity=\"0.54\"><\u002Fpath>\n        <path d=\"M241.7 373.1 Q382.4 243.3 468.9 72.5\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"2.80\" stroke-opacity=\"0.42\"><\u002Fpath>\n        <path d=\"M410.1 248.7 Q510.7 273.8 611.7 250.6\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"4.40\" stroke-opacity=\"0.66\"><\u002Fpath>\n        <path d=\"M410.1 248.7 Q468.5 363.0 572.4 438.4\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"3.60\" stroke-opacity=\"0.54\"><\u002Fpath>\n        <path d=\"M410.1 248.7 Q311.5 222.9 212.0 244.7\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"3.60\" stroke-opacity=\"0.54\"><\u002Fpath>\n        <path d=\"M410.1 248.7 Q272.3 343.2 183.5 484.8\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"2.80\" stroke-opacity=\"0.42\"><\u002Fpath>\n        <path d=\"M611.7 250.6 Q569.5 339.8 572.4 438.4\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"3.60\" stroke-opacity=\"0.54\"><\u002Fpath>\n        <path d=\"M611.7 250.6 Q496.8 171.4 358.5 153.0\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"2.80\" stroke-opacity=\"0.42\"><\u002Fpath>\n        <path d=\"M611.7 250.6 Q614.0 301.0 638.8 344.9\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"2.80\" stroke-opacity=\"0.42\"><\u002Fpath>\n        <path d=\"M212.0 244.7 Q141.0 228.8 70.5 246.8\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"3.60\" stroke-opacity=\"0.54\"><\u002Fpath>\n        <path d=\"M212.0 244.7 Q168.9 361.4 183.5 484.8\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"2.80\" stroke-opacity=\"0.42\"><\u002Fpath>\n        <path d=\"M212.0 244.7 Q359.4 186.9 468.9 72.5\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"2.80\" stroke-opacity=\"0.42\"><\u002Fpath>\n        <path d=\"M572.4 438.4 Q492.6 275.3 358.5 153.0\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"3.60\" stroke-opacity=\"0.54\"><\u002Fpath>\n        <path d=\"M638.8 344.9 Q717.7 309.2 771.8 241.6\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"3.60\" stroke-opacity=\"0.54\"><\u002Fpath>\n        <path d=\"M638.8 344.9 Q719.9 386.3 811.0 386.5\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"3.60\" stroke-opacity=\"0.54\"><\u002Fpath>\n        <path d=\"M771.8 241.6 Q774.0 318.7 811.0 386.5\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"2.80\" stroke-opacity=\"0.42\"><\u002Fpath>\n        <rect x=\"65.3\" y=\"323.5\" width=\"352.8\" height=\"99.2\" rx=\"5\" fill=\"#ffffff\" stroke=\"#F04E23\" stroke-width=\"3.2\"><\u002Frect>\n        <text x=\"241.7\" y=\"395.5\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"64.0\" font-weight=\"600\" fill=\"#16130F\">government<\u002Ftext>\n        <rect x=\"320.6\" y=\"209.2\" width=\"179.1\" height=\"79.0\" rx=\"5\" fill=\"#fff\" stroke=\"#16130F\" stroke-width=\"2\"><\u002Frect>\n        <text x=\"410.1\" y=\"266.5\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"51.0\" font-weight=\"600\" fill=\"#16130F\">states<\u002Ftext>\n        <rect x=\"541.6\" y=\"214.8\" width=\"140.1\" height=\"71.6\" rx=\"5\" fill=\"#fff\" stroke=\"#16130F\" stroke-width=\"2\"><\u002Frect>\n        <text x=\"611.7\" y=\"266.7\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"46.2\" font-weight=\"600\" fill=\"#16130F\">union<\u002Ftext>\n        <rect x=\"491.4\" y=\"403.1\" width=\"162.0\" height=\"70.6\" rx=\"5\" fill=\"#fff\" stroke=\"#16130F\" stroke-width=\"2\"><\u002Frect>\n        <text x=\"572.4\" y=\"454.3\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"45.5\" font-weight=\"600\" fill=\"#16130F\">people<\u002Ftext>\n        <rect x=\"144.9\" y=\"210.7\" width=\"134.2\" height=\"68.1\" rx=\"5\" fill=\"#fff\" stroke=\"#16130F\" stroke-width=\"2\"><\u002Frect>\n        <text x=\"212.0\" y=\"260.1\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"43.9\" font-weight=\"600\" fill=\"#16130F\">power<\u002Ftext>\n        <text x=\"638.8\" y=\"359.2\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"41.0\" font-weight=\"400\" fill=\"#16130F\">war<\u002Ftext>\n        <text x=\"183.5\" y=\"498.6\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"39.4\" font-weight=\"400\" fill=\"#16130F\">constitution<\u002Ftext>\n        <text x=\"70.5\" y=\"260.4\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"38.7\" font-weight=\"400\" fill=\"#16130F\">law<\u002Ftext>\n        <text x=\"358.5\" y=\"166.1\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"37.5\" font-weight=\"400\" fill=\"#16130F\">country<\u002Ftext>\n        <text x=\"468.9\" y=\"85.4\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"36.8\" font-weight=\"400\" fill=\"#16130F\">congress<\u002Ftext>\n        <text x=\"771.8\" y=\"254.3\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"36.4\" font-weight=\"400\" fill=\"#16130F\">army<\u002Ftext>\n        <text x=\"811.0\" y=\"399.0\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\" font-size=\"35.9\" font-weight=\"400\" fill=\"#16130F\">force<\u002Ftext>\n      <\u002Fsvg>\n      <div style=\"border-top:1px solid #E7E2DA;margin-top:18px;padding-top:16px;font-size:26px;line-height:1.45;color:#6E6862\">Lincoln’s message to Congress, July 1861 — the twelve most influential words of a 428-word network. Orange box: highest influence. Black boxes: influence above 0.05.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"What you get\" data-screen-label=\"03\" data-speaker-notes=\"Six modules, one conversion step. Emphasise that everything downstream reads the same generated file, so a study is a folder of readable markdown, not a database.\" style=\"color:#16130F;background:#FBFAF8;padding:96px 120px;display:flex;flex-direction:column;justify-content:center\">\n    <div style=\"font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#C63C15;font-weight:500;font-family:'IBM Plex Mono',ui-monospace,monospace;margin-bottom:24px\">02 · Scope<\u002Fdiv>\n    <h2 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:82px;line-height:1.03;letter-spacing:-.024em;margin:0 0 20px;font-weight:600\">One conversion. Six analyses.<\u002Fh2>\n    <p style=\"font-size:32px;line-height:1.45;color:#3D3833;margin:0 0 52px;max-width:52em\">The Generator is the only step that reads your documents. It writes one plain-markdown network file per text; every module below reads those files — so a completed study is a folder you can archive, email, or hand to a reviewer.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch\">\n      <div style=\"border:1px solid #E7E2DA;background:#fff;border-radius:18px;padding:32px;display:flex;flex-direction:column;justify-content:space-between\">\n        <div style=\"font-family:'Source Serif 4',Georgia,serif;font-size:38px;font-weight:600;margin-bottom:14px\">Visualizer<\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:26px;line-height:1.45;color:#3D3833;text-wrap:pretty\">The network drawn in the original Crawdad style, exported at 1920×1080 for slides.<\u002Fp>\n        <div style=\"font-size:26px;color:#6E6862;font-family:'IBM Plex Mono',ui-monospace,monospace\">1+ file<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E7E2DA;background:#fff;border-radius:18px;padding:32px;display:flex;flex-direction:column;justify-content:space-between\">\n        <div style=\"font-family:'Source Serif 4',Georgia,serif;font-size:38px;font-weight:600;margin-bottom:14px\">Comparator<\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:26px;line-height:1.45;color:#3D3833;text-wrap:pretty\">Four resonance values between two texts, with their shared and unique influential words.<\u002Fp>\n        <div style=\"font-size:26px;color:#6E6862;font-family:'IBM Plex Mono',ui-monospace,monospace\">2 files<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E7E2DA;background:#fff;border-radius:18px;padding:32px;display:flex;flex-direction:column;justify-content:space-between\">\n        <div style=\"font-family:'Source Serif 4',Georgia,serif;font-size:38px;font-weight:600;margin-bottom:14px\">Classifier<\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:26px;line-height:1.45;color:#3D3833;text-wrap:pretty\">Seeded K-means over mutual resonance, plus a hierarchical dendrogram you cut yourself.<\u002Fp>\n        <div style=\"font-size:26px;color:#6E6862;font-family:'IBM Plex Mono',ui-monospace,monospace\">5+ files<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E7E2DA;background:#fff;border-radius:18px;padding:32px;display:flex;flex-direction:column;justify-content:space-between\">\n        <div style=\"font-family:'Source Serif 4',Georgia,serif;font-size:38px;font-weight:600;margin-bottom:14px\">Theme Identifier<\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:26px;line-height:1.45;color:#3D3833;text-wrap:pretty\">PCA with varimax rotation over the corpus influence matrix, with defining words per theme.<\u002Fp>\n        <div style=\"font-size:26px;color:#6E6862;font-family:'IBM Plex Mono',ui-monospace,monospace\">5+ files<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E7E2DA;background:#fff;border-radius:18px;padding:32px;display:flex;flex-direction:column;justify-content:space-between\">\n        <div style=\"font-family:'Source Serif 4',Georgia,serif;font-size:38px;font-weight:600;margin-bottom:14px\">Latent Themes<\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:26px;line-height:1.45;color:#3D3833;text-wrap:pretty\">Scores texts against your own coding dictionary, and reports every code word that matched nothing.<\u002Fp>\n        <div style=\"font-size:26px;color:#6E6862;font-family:'IBM Plex Mono',ui-monospace,monospace\">1+ file<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E7E2DA;background:#fff;border-radius:18px;padding:32px;display:flex;flex-direction:column;justify-content:space-between\">\n        <div style=\"font-family:'Source Serif 4',Georgia,serif;font-size:38px;font-weight:600;margin-bottom:14px\">Summarizer<\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:26px;line-height:1.45;color:#3D3833;text-wrap:pretty\">One row per text, 29 columns — a flat dataset ready for R, Stata or SPSS.<\u002Fp>\n        <div style=\"font-size:26px;color:#6E6862;font-family:'IBM Plex Mono',ui-monospace,monospace\">2+ files<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Reproducibility\" data-screen-label=\"04\" data-speaker-notes=\"This is the slide that wins methodologists. No model, no randomness, no network: the same inputs give byte-identical outputs on any machine, and every output carries the settings that produced it.\" style=\"background:#16130F;color:#FBFAF8;padding:96px 120px;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center\">\n    <div>\n      <div style=\"font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#C63C15;font-weight:500;font-family:'IBM Plex Mono',ui-monospace,monospace;margin-bottom:26px\">03 · Defensibility<\u002Fdiv>\n      <h2 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:82px;line-height:1.03;letter-spacing:-.024em;margin:0 0 36px;font-weight:600;color:#FBFAF8\">Deterministic, and audited<\u002Fh2>\n      <p style=\"font-size:32px;line-height:1.5;color:#E7E2DA;margin:0 0 34px;text-wrap:pretty\">The same files with the same settings produce byte-identical results on any machine. There is no model, no randomness — clustering uses a fixed seed — and no network dependence. Every output file records the parameters that produced it.<\u002Fp>\n      <p style=\"font-size:28px;line-height:1.5;color:#6E6862;margin:0;text-wrap:pretty\">A nine-component validation study (completed at v1.4.6; its golden corpus reproduces byte-identically under v1.4.7) checked network, resonance, clustering, theme and text-metric calculations against NetworkX, scikit-learn, SciPy and hand-worked examples.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px\">\n      <div style=\"border:1px solid #3D3833;border-radius:18px;padding:34px;background:#16130F\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:66px;color:#F04E23;font-weight:600;margin-bottom:12px\">0.975<\u002Fdiv>\n        <div style=\"font-size:26px;line-height:1.4;color:#E7E2DA\">Parser F1 against a 60-sentence hand-annotated gold corpus<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #3D3833;border-radius:18px;padding:34px;background:#16130F\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:66px;color:#FBFAF8;font-weight:600;margin-bottom:12px\">150<\u002Fdiv>\n        <div style=\"font-size:26px;line-height:1.4;color:#E7E2DA\">Automated checks you can run yourself in <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:25px\">tests\u002Findex.html<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #3D3833;border-radius:18px;padding:34px;background:#16130F\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:66px;color:#FBFAF8;font-weight:600;margin-bottom:12px\">SHA-256<\u002Fdiv>\n        <div style=\"font-size:26px;line-height:1.4;color:#E7E2DA\">A published checksum for every file in the distribution<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #3D3833;border-radius:18px;padding:34px;background:#16130F\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:66px;color:#FBFAF8;font-weight:600;margin-bottom:12px\">2002<\u002Fdiv>\n        <div style=\"font-size:26px;line-height:1.4;color:#E7E2DA\">Peer-reviewed method, cited in every output file<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Deployment\" data-screen-label=\"05\" data-speaker-notes=\"For IT and procurement: there is nothing to procure. Unzip, open index.html. No installation, no admin rights, no account, no telemetry, no data leaving the machine — which usually removes the whole privacy review.\" style=\"color:#16130F;background:#fff;padding:96px 120px;display:flex;flex-direction:column;justify-content:center\">\n    <div style=\"font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#C63C15;font-weight:500;font-family:'IBM Plex Mono',ui-monospace,monospace;margin-bottom:24px\">04 · Adoption cost<\u002Fdiv>\n    <h2 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:82px;line-height:1.03;letter-spacing:-.024em;margin:0 0 20px;font-weight:600\">Unzip. Double-click. Done.<\u002Fh2>\n    <p style=\"font-size:32px;line-height:1.45;color:#3D3833;margin:0 0 52px;max-width:52em\">There is no server to stand up, no licence server, no account, and no vendor between you and your data. The security review is a folder of files and a checksum list.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:26px\">\n      <div style=\"border:1px solid #E7E2DA;background:#FBFAF8;border-radius:18px;padding:34px 38px\">\n        <div style=\"font-size:34px;font-weight:600;margin-bottom:12px\">Nothing is installed<\u002Fdiv>\n        <p style=\"margin:0;font-size:27px;line-height:1.45;color:#3D3833\">Unzip anywhere and open <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px\">index.html<\u002Fspan>. No administrator rights. Chrome, Edge, Firefox or Safari, on Mac, Windows or Linux.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E7E2DA;background:#FBFAF8;border-radius:18px;padding:34px 38px\">\n        <div style=\"font-size:34px;font-weight:600;margin-bottom:12px\">Nothing leaves the machine<\u002Fdiv>\n        <p style=\"margin:0;font-size:27px;line-height:1.45;color:#3D3833\">No network access, no storage, no telemetry — documented in <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px\">SECURITY-AND-PROVENANCE.md<\u002Fspan> along with every bundled open-source licence.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E7E2DA;background:#FBFAF8;border-radius:18px;padding:34px 38px\">\n        <div style=\"font-size:34px;font-weight:600;margin-bottom:12px\">Works with what you have<\u002Fdiv>\n        <p style=\"margin:0;font-size:27px;line-height:1.45;color:#3D3833\">Ingests .txt, .md, .pdf and .docx, cleans citation artifacts automatically, and logs exactly what it removed from each file.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E7E2DA;background:#FBFAF8;border-radius:18px;padding:34px 38px\">\n        <div style=\"font-size:34px;font-weight:600;margin-bottom:12px\">Outputs you already know<\u002Fdiv>\n        <p style=\"margin:0;font-size:27px;line-height:1.45;color:#3D3833\">Markdown reports, slide-ready PNGs, machine-readable tables, and a one-click session bundle that moves a whole study to another machine.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Evidence and limits\" data-screen-label=\"06\" data-speaker-notes=\"Close honestly. Show that it recovers known structure without being told anything, then state the limits plainly — that is what an evaluator needs in order to say yes.\" style=\"color:#16130F;background:#FBFAF8;padding:96px 120px;display:grid;grid-template-columns:1.1fr 1fr;gap:80px;align-items:center\">\n    <div>\n      <div style=\"font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#C63C15;font-weight:500;font-family:'IBM Plex Mono',ui-monospace,monospace;margin-bottom:26px\">05 · Does it actually work<\u002Fdiv>\n      <h2 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:76px;line-height:1.05;letter-spacing:-.024em;margin:0 0 34px;font-weight:600\">It recovers structure it was never told about<\u002Fh2>\n      <p style=\"font-size:31px;line-height:1.5;color:#3D3833;margin:0 0 30px;text-wrap:pretty\">Given 26 Lincoln texts spanning 1832–1865 and no dates, titles or genre labels, the Classifier isolated the 1857–58 debate speeches as one cluster and the late-war canon — Gettysburg, the last two annual messages, the Second Inaugural — as another.<\u002Fp>\n      <p style=\"font-size:31px;line-height:1.5;color:#3D3833;margin:0 0 26px;text-wrap:pretty\">The Theme Identifier independently produced a debate theme defined by <em>slavery, judge, question, territories<\u002Fem> and a constitutional-crisis theme defined by <em>laws, government, union, constitution<\u002Fem>. Coherence against information the algorithm never saw is the strongest validity check available.<\u002Fp>\n      <div style=\"border-top:1px solid #E7E2DA;padding-top:18px;font-size:22px;line-height:1.5;color:#6E6862\">Corman, S., Kuhn, T., McPhee, R., &amp; Dooley, K. (2002). Studying complex discursive systems: Centering Resonance Analysis of organizational communication. <em>Human Communication Research, 28<\u002Fem>(2), 157–206.<br>Dooley, K. (2026). <em>Crawdad Text Analysis Software<\u002Fem> (Version 1.4.7) [Computer software].<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #C63C15;background:#FBDCCF;border-radius:22px;padding:44px 46px\">\n      <div style=\"font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#C63C15;font-weight:500;font-family:'IBM Plex Mono',ui-monospace,monospace;margin-bottom:26px\">What it will not do for you<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:26px\">\n        <div style=\"font-size:29px;line-height:1.45;color:#3D3833\"><strong>It will not interpret.<\u002Fstrong> The software measures structure; building the argument, and standing behind it, remains your job.<\u002Fdiv>\n        <div style=\"font-size:29px;line-height:1.45;color:#3D3833\"><strong>It will not rescue short texts.<\u002Fstrong> Under roughly 100 nodes, metrics are unstable and clusters group by sparsity rather than content.<\u002Fdiv>\n        <div style=\"font-size:29px;line-height:1.45;color:#3D3833\"><strong>It will not bridge synonyms.<\u002Fstrong> Resonance matches stems; two texts on one topic in different vocabulary score low, correctly.<\u002Fdiv>\n        <div style=\"font-size:29px;line-height:1.45;color:#3D3833\"><strong>Two metrics are heuristics.<\u002Fstrong> Abstractness and agreeableness are transparent proxies, flagged as such, for comparison only.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
